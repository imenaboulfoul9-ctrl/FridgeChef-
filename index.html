<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FridgeChef 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ec;
    --warm: #f5ede0;
    --orange: #e8602c;
    --orange-light: #f0855a;
    --green: #2d6a4f;
    --green-light: #52b788;
    --text: #1a1209;
    --muted: #7a6a55;
    --card: #fffaf4;
    --border: #e8d9c4;
    --shadow: rgba(60,30,10,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--orange);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(232,96,44,0.25);
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .logo span { color: #ffe8a0; }
  .header-btns { display: flex; gap: 0.7rem; }
  .btn-nav {
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.4);
    color: #fff;
    border-radius: 50px;
    padding: 0.5rem 1.1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .btn-nav:hover { background: rgba(255,255,255,0.30); }
  .btn-nav.active { background: #fff; color: var(--orange); }
  .fav-count {
    background: #ffe8a0;
    color: var(--orange);
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 0.72rem;
    font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ── MAIN LAYOUT ── */
  .app { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* ── HERO / SEARCH SECTION ── */
  .hero {
    text-align: center;
    padding: 2.5rem 0 2rem;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 0.6rem;
  }
  .hero p { color: var(--muted); font-size: 1.05rem; margin-bottom: 2rem; }

  /* ── INGREDIENT INPUT ── */
  .ingredient-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 1.5rem;
    max-width: 680px;
    margin: 0 auto 1.5rem;
    box-shadow: 0 4px 24px var(--shadow);
  }
  .input-row {
    display: flex;
    gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .ingredient-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 0.7rem 1.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    background: var(--cream);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .ingredient-input:focus { border-color: var(--orange); }
  .ingredient-input::placeholder { color: #b5a08a; }

  .btn-add {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 0.7rem 1.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-add:hover { background: var(--orange-light); }
  .btn-add:active { transform: scale(0.96); }

  .tags-area {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    min-height: 36px;
    margin-bottom: 1rem;
  }
  .ingredient-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--warm);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 0.3rem 0.9rem 0.3rem 1rem;
    font-size: 0.88rem;
    color: var(--text);
    animation: tagPop 0.2s ease;
  }
  @keyframes tagPop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tag-remove {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1rem; line-height: 1;
    padding: 0; display: flex; align-items: center;
    transition: color 0.15s;
  }
  .tag-remove:hover { color: var(--orange); }

  .btn-search {
    width: 100%;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn-search:hover { background: var(--green-light); }
  .btn-search:active { transform: scale(0.98); }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── QUICK SUGGESTIONS ── */
  .suggestions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }
  .suggestion-chip {
    background: var(--warm);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 0.35rem 0.9rem;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
    font-weight: 400;
  }
  .suggestion-chip:hover { background: var(--orange); color: #fff; border-color: var(--orange); }

  /* ── STATUS / LOADER ── */
  .status-bar {
    text-align: center;
    padding: 0.8rem;
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 40px;
  }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2.5px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RESULTS GRID ── */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    color: var(--text);
  }
  .section-title span { color: var(--orange); }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.2rem;
    margin-bottom: 3rem;
  }

  .recipe-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: cardIn 0.3s ease both;
    position: relative;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .recipe-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px var(--shadow); }

  .recipe-card img {
    width: 100%; height: 160px; object-fit: cover;
    display: block;
  }
  .recipe-card-body { padding: 0.9rem; }
  .recipe-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 0.4rem;
    color: var(--text);
  }
  .recipe-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .badge {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 50px;
    font-weight: 500;
  }
  .badge-cat { background: #fce8db; color: #c0440c; }
  .badge-area { background: #ddf5e8; color: #1a6638; }

  .btn-fav {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.88);
    border: none;
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
    backdrop-filter: blur(4px);
  }
  .btn-fav:hover { transform: scale(1.2); }
  .btn-fav.is-fav { color: var(--orange); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,10,5,0.55);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--card);
    border-radius: 20px;
    max-width: 680px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 24px 60px rgba(20,10,5,0.3);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 20px 20px 0 0; }
  .modal-body { padding: 1.5rem; }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    margin-bottom: 0.5rem;
  }
  .modal-meta { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .modal-section { margin-bottom: 1.2rem; }
  .modal-section h3 {
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 0.7rem;
  }
  .ingredients-list {
    display: flex; flex-wrap: wrap; gap: 0.4rem;
  }
  .ing-chip {
    background: var(--warm);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 0.3rem 0.8rem;
    font-size: 0.82rem;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .ing-chip img { width: 18px; height: 18px; object-fit: cover; border-radius: 50%; }

  .note-area {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    background: var(--cream);
    color: var(--text);
    resize: vertical;
    min-height: 70px;
    outline: none;
  }
  .note-area:focus { border-color: var(--orange); }

  .modal-actions {
    display: flex; gap: 0.7rem; margin-top: 1.2rem;
  }
  .btn-modal {
    flex: 1;
    padding: 0.75rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
  }
  .btn-modal:hover { opacity: 0.85; }
  .btn-modal-primary { background: var(--orange); color: #fff; }
  .btn-modal-sec { background: var(--warm); color: var(--text); border: 1.5px solid var(--border); }
  .btn-close-modal {
    position: sticky;
    float: right;
    top: 1rem;
    right: 1rem;
    background: rgba(255,255,255,0.8);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    margin: 0.8rem 0.8rem 0 auto;
  }

  /* ── FAVORITES PAGE ── */
  .page { display: none; }
  .page.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }
  .empty-state .big-emoji { font-size: 4rem; display: block; margin-bottom: 1rem; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: #fff;
    padding: 0.7rem 1.4rem;
    border-radius: 50px;
    font-size: 0.9rem;
    z-index: 9999;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 1rem; }
    .logo { font-size: 1.4rem; }
    .btn-nav span { display: none; }
    .results-grid { grid-template-columns: 1fr 1fr; }
    .modal-title { font-size: 1.3rem; }
  }

  /* Instructions étapes */
  .steps-list { list-style: none; counter-reset: step; }
  .steps-list li {
    counter-increment: step;
    display: flex; gap: 0.9rem;
    margin-bottom: 0.8rem;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text);
  }
  .steps-list li::before {
    content: counter(step);
    background: var(--orange);
    color: #fff;
    min-width: 24px; height: 24px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .source-link {
    display: inline-flex; align-items: center; gap: 0.3rem;
    color: var(--orange);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
  }
  .source-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="logo">Fridge<span>Chef</span> 🍳</div>
  <div class="header-btns">
    <button class="btn-nav active" id="btn-home" onclick="showPage('home')">
      🔍 <span>Rechercher</span>
    </button>
    <button class="btn-nav" id="btn-favs" onclick="showPage('favs')">
      ⭐ <span>Favoris</span> <span class="fav-count" id="fav-count">0</span>
    </button>
  </div>
</header>

<!-- ═══════════════ PAGE HOME ═══════════════ -->
<div class="app">
  <div class="page active" id="page-home">
    <div class="hero">
      <h1>Qu'est-ce que tu as<br>dans ton frigo ? 🥦</h1>
      <p>Ajoute tes ingrédients et découvre des recettes délicieuses</p>
    </div>

    <div class="ingredient-box">
      <div class="input-row">
        <input
          class="ingredient-input"
          id="ingredient-input"
          type="text"
          placeholder="Ex: poulet, tomate, ail…"
          onkeydown="handleKey(event)"
          autocomplete="off"
        />
        <button class="btn-add" onclick="addIngredient()">+ Ajouter</button>
      </div>
      <div class="tags-area" id="tags-area"></div>
      <button class="btn-search" id="btn-search" onclick="searchRecipes()">
        🍽️ Trouver des recettes
      </button>
    </div>

    <div class="suggestions">
      <span style="font-size:0.82rem; color:var(--muted); align-self:center;">Essaie :</span>
      <button class="suggestion-chip" onclick="quickSearch('chicken')">🍗 Poulet</button>
      <button class="suggestion-chip" onclick="quickSearch('beef')">🥩 Bœuf</button>
      <button class="suggestion-chip" onclick="quickSearch('salmon')">🐟 Saumon</button>
      <button class="suggestion-chip" onclick="quickSearch('eggs')">🥚 Œufs</button>
      <button class="suggestion-chip" onclick="quickSearch('cheese')">🧀 Fromage</button>
    </div>

    <div class="status-bar" id="status-bar"></div>

    <div id="results-section" style="display:none">
      <div class="section-title">Recettes trouvées pour <span id="result-label"></span></div>
      <div class="results-grid" id="results-grid"></div>
    </div>
  </div>

  <!-- ═══════════════ PAGE FAVORIS ═══════════════ -->
  <div class="page" id="page-favs">
    <div class="section-title" style="padding-top:1.5rem">Mes favoris ⭐</div>
    <div class="results-grid" id="favs-grid"></div>
    <div class="empty-state" id="favs-empty" style="display:none">
      <span class="big-emoji">🌿</span>
      <p>Aucun favori pour l'instant.<br>Sauvegarde des recettes depuis la recherche !</p>
    </div>
  </div>
</div>

<!-- ═══════════════ MODAL RECETTE ═══════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <button class="btn-close-modal" onclick="closeModal()">✕</button>
    <img class="modal-img" id="modal-img" src="" alt="">
    <div class="modal-body">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>

      <div class="modal-section">
        <h3>Ingrédients</h3>
        <div class="ingredients-list" id="modal-ingredients"></div>
      </div>

      <div class="modal-section">
        <h3>Instructions</h3>
        <ol class="steps-list" id="modal-steps"></ol>
      </div>

      <div class="modal-section" id="modal-source-section"></div>

      <div class="modal-section">
        <h3>Ma note personnelle 📝</h3>
        <textarea class="note-area" id="modal-note" placeholder="Ajoute tes notes, modifications…"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-modal-primary" id="modal-fav-btn" onclick="toggleFavModal()">⭐ Sauvegarder</button>
        <button class="btn-modal btn-modal-sec" onclick="saveNote()">💾 Sauver la note</button>
        <button class="btn-modal btn-modal-sec" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ TOAST ═══════════════ -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════
//  ÉTAT DE L'APPLICATION
// ═══════════════════════════════════
let ingredients = [];
let favorites = JSON.parse(localStorage.getItem('fridgechef_favorites') || '{}');
let notes = JSON.parse(localStorage.getItem('fridgechef_notes') || '{}');
let currentRecipe = null;
const API_BASE = 'https://www.themealdb.com/api/json/v1/1';

// ═══════════════════════════════════
//  NAVIGATION DES PAGES
// ═══════════════════════════════════
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('btn-' + page).classList.add('active');
  if (page === 'favs') renderFavorites();
}

// ═══════════════════════════════════
//  GESTION DES INGRÉDIENTS
// ═══════════════════════════════════
function handleKey(e) {
  if (e.key === 'Enter') addIngredient();
}

function addIngredient() {
  const input = document.getElementById('ingredient-input');
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  if (ingredients.includes(val)) { showToast('Ingrédient déjà ajouté !'); return; }
  if (ingredients.length >= 5) { showToast('Maximum 5 ingrédients'); return; }
  ingredients.push(val);
  renderTags();
  input.value = '';
  input.focus();
}

function removeIngredient(name) {
  ingredients = ingredients.filter(i => i !== name);
  renderTags();
}

function renderTags() {
  const area = document.getElementById('tags-area');
  area.innerHTML = ingredients.map(i =>
    `<span class="ingredient-tag">${i}
      <button class="tag-remove" onclick="removeIngredient('${i}')" title="Retirer">×</button>
    </span>`
  ).join('');
}

function quickSearch(ing) {
  ingredients = [ing];
  renderTags();
  searchRecipes();
}

// ═══════════════════════════════════
//  RECHERCHE DE RECETTES (fetch + API)
// ═══════════════════════════════════
async function searchRecipes() {
  if (ingredients.length === 0) { showToast('Ajoute au moins un ingrédient !'); return; }
  const status = document.getElementById('status-bar');
  const section = document.getElementById('results-section');
  const grid = document.getElementById('results-grid');

  status.innerHTML = '<span class="spinner"></span> Recherche en cours…';
  section.style.display = 'none';
  grid.innerHTML = '';

  try {
    // On recherche par le premier ingrédient (TheMealDB filtre par ingrédient)
    const main = ingredients[0];
    const res = await fetch(`${API_BASE}/filter.php?i=${encodeURIComponent(main)}`);
    if (!res.ok) throw new Error('Erreur réseau');
    const data = await res.json();

    if (!data.meals) {
      status.innerHTML = `😕 Aucune recette trouvée pour "<strong>${main}</strong>"`;
      return;
    }

    // Limiter à 12 résultats
    const meals = data.meals.slice(0, 12);
    status.innerHTML = `✅ ${meals.length} recettes trouvées !`;

    document.getElementById('result-label').textContent = ingredients.join(', ');
    section.style.display = 'block';

    // Charger les détails en parallèle (Promise.all + async/await)
    const details = await Promise.all(
      meals.map(m => fetchMealDetail(m.idMeal))
    );

    details.filter(Boolean).forEach((meal, i) => {
      const card = createCard(meal, i * 60);
      grid.appendChild(card);
    });

  } catch (err) {
    status.innerHTML = '⚠️ Erreur de connexion. Vérifie ta connexion internet.';
    console.error(err);
  }
}

async function fetchMealDetail(id) {
  try {
    const res = await fetch(`${API_BASE}/lookup.php?i=${id}`);
    const data = await res.json();
    return data.meals ? data.meals[0] : null;
  } catch { return null; }
}

// ═══════════════════════════════════
//  CRÉATION DES CARTES
// ═══════════════════════════════════
function createCard(meal, delay = 0) {
  const isFav = !!favorites[meal.idMeal];
  const div = document.createElement('div');
  div.className = 'recipe-card';
  div.style.animationDelay = delay + 'ms';
  div.innerHTML = `
    <img src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x160?text=🍽'">
    <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="event.stopPropagation(); toggleFav('${meal.idMeal}', this)" title="Favori">
      ${isFav ? '⭐' : '☆'}
    </button>
    <div class="recipe-card-body">
      <div class="recipe-card-title">${meal.strMeal}</div>
      <div class="recipe-meta">
        ${meal.strCategory ? `<span class="badge badge-cat">${meal.strCategory}</span>` : ''}
        ${meal.strArea ? `<span class="badge badge-area">${meal.strArea}</span>` : ''}
      </div>
    </div>
  `;
  div.addEventListener('click', () => openModal(meal));
  return div;
}

// ═══════════════════════════════════
//  MODAL RECETTE DÉTAILLÉE
// ═══════════════════════════════════
function openModal(meal) {
  currentRecipe = meal;
  document.getElementById('modal-img').src = meal.strMealThumb;
  document.getElementById('modal-img').alt = meal.strMeal;
  document.getElementById('modal-title').textContent = meal.strMeal;

  // Méta
  const meta = document.getElementById('modal-meta');
  meta.innerHTML = [
    meal.strCategory && `<span class="badge badge-cat">${meal.strCategory}</span>`,
    meal.strArea && `<span class="badge badge-area">${meal.strArea}</span>`
  ].filter(Boolean).join('');

  // Ingrédients
  const ings = getIngredients(meal);
  document.getElementById('modal-ingredients').innerHTML = ings.map(i =>
    `<span class="ing-chip">
      <img src="https://www.themealdb.com/images/ingredients/${encodeURIComponent(i.name)}-Small.png" alt="" onerror="this.style.display='none'">
      ${i.measure} ${i.name}
    </span>`
  ).join('');

  // Instructions (découper en étapes)
  const steps = (meal.strInstructions || '').split(/\r?\n/).filter(s => s.trim().length > 10);
  document.getElementById('modal-steps').innerHTML = steps.slice(0, 12).map(s =>
    `<li>${s.trim()}</li>`
  ).join('') || '<li>Voir instructions complètes sur la source.</li>';

  // Source
  const srcSection = document.getElementById('modal-source-section');
  if (meal.strYoutube) {
    srcSection.innerHTML = `<a class="source-link" href="${meal.strYoutube}" target="_blank">▶ Voir la vidéo YouTube</a>`;
  } else if (meal.strSource) {
    srcSection.innerHTML = `<a class="source-link" href="${meal.strSource}" target="_blank">🔗 Recette originale</a>`;
  } else { srcSection.innerHTML = ''; }

  // Note sauvegardée
  document.getElementById('modal-note').value = notes[meal.idMeal] || '';

  // Bouton favori
  updateModalFavBtn(!!favorites[meal.idMeal]);

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function getIngredients(meal) {
  const list = [];
  for (let i = 1; i <= 20; i++) {
    const name = meal[`strIngredient${i}`];
    const measure = meal[`strMeasure${i}`];
    if (name && name.trim()) list.push({ name: name.trim(), measure: (measure || '').trim() });
  }
  return list;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  currentRecipe = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ═══════════════════════════════════
//  FAVORIS (localStorage)
// ═══════════════════════════════════
function toggleFav(id, btn) {
  if (favorites[id]) {
    delete favorites[id];
    if (btn) { btn.textContent = '☆'; btn.classList.remove('is-fav'); }
    showToast('Retiré des favoris');
  } else {
    // On doit récupérer les données du meal — on cherche dans le DOM ou on refetch
    showToast('Favori ajouté ⭐');
    // On cherche le meal dans le DOM via currentRecipe ou on refetch
    fetchMealDetail(id).then(meal => {
      if (meal) {
        favorites[id] = meal;
        saveFavorites();
        updateFavCount();
        if (btn) { btn.textContent = '⭐'; btn.classList.add('is-fav'); }
      }
    });
    return;
  }
  saveFavorites();
  updateFavCount();
}

function toggleFavModal() {
  if (!currentRecipe) return;
  const id = currentRecipe.idMeal;
  if (favorites[id]) {
    delete favorites[id];
    showToast('Retiré des favoris');
    updateModalFavBtn(false);
  } else {
    favorites[id] = currentRecipe;
    showToast('Favori ajouté ⭐');
    updateModalFavBtn(true);
  }
  saveFavorites();
  updateFavCount();
  // Mise à jour des cartes dans la grille
  document.querySelectorAll('.recipe-card').forEach(card => {
    const img = card.querySelector('img');
    if (img && img.alt === currentRecipe.strMeal) {
      const btn = card.querySelector('.btn-fav');
      if (btn) {
        const isFav = !!favorites[id];
        btn.textContent = isFav ? '⭐' : '☆';
        btn.classList.toggle('is-fav', isFav);
      }
    }
  });
}

function updateModalFavBtn(isFav) {
  const btn = document.getElementById('modal-fav-btn');
  btn.textContent = isFav ? '⭐ Retirer des favoris' : '⭐ Sauvegarder';
}

function saveFavorites() {
  localStorage.setItem('fridgechef_favorites', JSON.stringify(favorites));
}

function updateFavCount() {
  const count = Object.keys(favorites).length;
  document.getElementById('fav-count').textContent = count;
}

// ═══════════════════════════════════
//  NOTES (localStorage)
// ═══════════════════════════════════
function saveNote() {
  if (!currentRecipe) return;
  const val = document.getElementById('modal-note').value;
  notes[currentRecipe.idMeal] = val;
  localStorage.setItem('fridgechef_notes', JSON.stringify(notes));
  showToast('Note sauvegardée 💾');
}

// ═══════════════════════════════════
//  PAGE FAVORIS
// ═══════════════════════════════════
function renderFavorites() {
  const grid = document.getElementById('favs-grid');
  const empty = document.getElementById('favs-empty');
  const favList = Object.values(favorites);
  grid.innerHTML = '';
  if (favList.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  favList.forEach((meal, i) => {
    grid.appendChild(createCard(meal, i * 50));
  });
}

// ═══════════════════════════════════
//  TOAST
// ═══════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
updateFavCount();
</script>
</body>
</html>
